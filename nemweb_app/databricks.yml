bundle:
  name: agentic-energy-workshop-app

variables:
  # short_name often contains a dot (first.last), which is illegal in App names
  # and Lakebase branch IDs. Default to the bundle target so validate works
  # without --var; override per attendee when more than one person shares a workspace.
  attendee_slug:
    description: >-
      Short per-attendee identifier. Lowercase letters, numbers, and hyphens
      only, starting with a letter, 26 characters or fewer.
    default: ${bundle.target}

  # App names permit only lowercase alphanumerics and hyphens and are limited to
  # 2-30 characters total (Apps create API). The former literal prefix
  # "agentic-energy-workshop-" consumed 24 of those 30 characters, leaving 6 for
  # the attendee, so the prefix is short by necessity rather than by preference.
  app_name_prefix:
    description: Short app-name prefix; keep it brief so the slug fits in 30 characters
    default: aew

  app_name:
    description: >-
      Per-attendee App name, derived from app_name_prefix and attendee_slug.
      Must be unique within the workspace.
    default: ${var.app_name_prefix}-${var.attendee_slug}

  sql_warehouse_id:
    description: >-
      SQL warehouse the app may use. Defaults to the warehouse this bundle
      creates so an attendee does not copy an ID from the foundation deploy.
    default: ${resources.sql_warehouses.analytics.id}
  serving_catalog:
    description: Catalog holding the reviewed app serving tables
    default: ${workspace.current_user.short_name}
  serving_schema:
    description: Schema holding the reviewed app serving tables
    default: agentic_energy_workshop_serving
  region_status_table:
    description: Fully qualified reviewed region-status serving table
    default: ${var.serving_catalog}.${var.serving_schema}.gold_nem_app_region_status
  fuel_generation_table:
    description: Fully qualified reviewed fuel-generation serving table
    default: ${var.serving_catalog}.${var.serving_schema}.gold_nem_scada_generation_5min

  # Lakebase isolation. Each attendee works on their own copy-on-write branch of
  # a shared seeded parent, so schema names (app_write, app_read) stay identical
  # for everyone and the application code needs no per-attendee change.
  lakebase_project_id:
    description: >-
      Lakebase Autoscaling project ID without the projects/ prefix. Defaults
      to the project this bundle creates.
    default: ${resources.postgres_projects.lakebase.project_id}

  postgres_branch_id:
    description: >-
      Per-attendee Lakebase branch ID, derived from attendee_slug. The
      facilitator creates this branch from the seeded parent before the attendee
      deploys.
    default: dev-${var.attendee_slug}

  # A child branch inherits its parent's database ID, so this is the same value
  # for every attendee and is supplied rather than derived from the slug.
  #
  # Note the hyphen. This is the Lakebase *resource ID*, which is
  # "databricks-postgres", not the Postgres *database name*, which is
  # "databricks_postgres". Using the underscored form here produces a resource
  # path that does not exist. Confirm with:
  #   databricks postgres list-databases projects/<p>/branches/<b> --profile <prof>
  postgres_database_id:
    description: Lakebase database resource ID within the branch (hyphenated, not the Postgres database name)
    default: databricks-postgres

  # Composed rather than hand-supplied so an attendee cannot accidentally point
  # their app at another attendee's branch.
  postgres_branch:
    description: Full Lakebase branch resource name, composed from project and branch ID
    default: projects/${var.lakebase_project_id}/branches/${var.postgres_branch_id}

  postgres_database:
    description: Full Lakebase database resource name, composed from the branch path
    default: projects/${var.lakebase_project_id}/branches/${var.postgres_branch_id}/databases/${var.postgres_database_id}

resources:
  postgres_projects:
    lakebase:
      project_id: aew-${var.attendee_slug}
      display_name: NEM operations ${var.attendee_slug}
      pg_version: 17
  postgres_branches:
    attendee:
      parent: ${resources.postgres_projects.lakebase.id}
      branch_id: ${var.postgres_branch_id}
      no_expiry: true
  sql_warehouses:
    analytics:
      name: ${var.app_name}-sql
      warehouse_type: PRO
      enable_serverless_compute: true
      enable_photon: true
      cluster_size: 2X-Small
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 10
  apps:
    app:
      name: ${var.app_name}
      description: NEM regional operations AppKit starter
      source_code_path: ./
      lifecycle:
        started: true
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        # Analytics runs as the App service principal. Declaring the fixed,
        # reviewed serving table grants least-privilege SELECT without exposing
        # a caller-controlled identifier.
        - name: region-status-table
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.region_status_table}
            permission: SELECT
        # Second, separate grant for the fuel value-capture read. It is declared
        # explicitly rather than widened to the schema so the app's privileges stay
        # enumerable, and so a workspace without this table published simply loses
        # the value-capture section instead of failing the whole screen.
        #
        # Requires the facilitator to publish gold_nem_scada_generation_5min into
        # the app serving schema. Until then, integration mode reports the
        # generation read as unavailable by design.
        - name: fuel-generation-table
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.fuel_generation_table}
            permission: SELECT
        # CAN_CONNECT_AND_CREATE lets the app's service principal create and
        # therefore own app_write on its own branch. Deploy the app BEFORE
        # running locally, or the schema ends up owned by a human identity and
        # the app fails with permission denied (42501).
        - name: postgres
          postgres:
            branch: ${var.postgres_branch}
            database: ${var.postgres_database}
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    default: true
    mode: development
