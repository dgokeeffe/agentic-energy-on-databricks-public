resources:
  jobs:
    agentic_energy_etl:
      name: "[${bundle.target}] Agentic Energy ETL"
      max_concurrent_runs: 1
      # run_as is set per target, not here. Pinning one service principal made the
      # job undeployable by anyone else: binding an SP into run_as requires the
      # servicePrincipal.user role on it, so every developer except that SP got
      # 403 PERMISSION_DENIED from jobs/create. dev deploys run as whoever
      # deploys them; only the shared workshop target pins the ETL SP.
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: ${var.participant_group}
        - level: CAN_MANAGE
          group_name: ${var.facilitator_group}
      parameters:
        - name: metadata_path
          default: ""
        - name: metadata_snapshot_id
          default: ""
        # Acquisition mode is a run parameter, defaulting to fixture. Live
        # NEMWEB acquisition requires PF-8 (AEMO data-use authorization) and
        # facilitator approval, so enabling it is a deliberate per-run override
        # that is recorded against the job run and stamped into the run
        # manifest. Keeping it a parameter rather than a redeploy means the
        # decision is auditable and reversible: no wheel rebuild, and the next
        # run reverts to fixture unless someone opts in again.
        - name: mode
          default: fixture
      tasks:
        - task_key: metadata_etl
          environment_key: default
          # Retries are a task-level setting in the Jobs API. Declaring
          # max_retries on the job is an unknown field: the CLI drops it and
          # `bundle validate --strict` fails on the resulting warning.
          max_retries: 0
          python_wheel_task:
            package_name: agentic-energy-on-databricks
            entry_point: main
            parameters:
              - --metadata
              - "{{job.parameters.metadata_path}}"
              - --metadata-root
              - /Volumes/${var.catalog}/${var.schema}/${var.landing_volume}
              - --metadata-snapshot-id
              - "{{job.parameters.metadata_snapshot_id}}"
              - --output
              - /Volumes/${var.catalog}/${var.schema}/${var.landing_volume}/${bundle.target}/runs/{{job.run_id}}
              - --run-id
              - "{{job.run_id}}"
              # Publish the run's layers as governed Delta tables so Bronze/
              # Silver/Quarantine/Gold are queryable in Unity Catalog. The
              # Volume run directory remains the immutable evidence; these
              # tables are keyed by {{job.run_id}} and a republish deletes that
              # run's rows first, so a retried task cannot double-count.
              - --publish-catalog
              - ${var.catalog}
              - --publish-schema
              - ${var.schema}
              - --mode
              - "{{job.parameters.mode}}"
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      # Keep this disabled until the facilitator has approved source terms,
      # identity, storage, and the target workspace preflight.
      schedule:
        pause_status: PAUSED
        quartz_cron_expression: "0 0/30 * * * ?"
        timezone_id: Australia/Sydney
