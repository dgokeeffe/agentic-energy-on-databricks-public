# Serverless SQL warehouse for the publication job. The app reads Lakebase.
resources:
  sql_warehouses:
    analytics:
      name: ${var.resource_prefix}-sql
      warehouse_type: PRO
      enable_serverless_compute: true
      enable_photon: true
      cluster_size: 2X-Small
      min_num_clusters: 1
      max_num_clusters: 1
      auto_stop_mins: 10
      permissions:
        - level: CAN_USE
          group_name: ${var.participant_group}
        - level: CAN_MANAGE
          group_name: ${var.facilitator_group}
