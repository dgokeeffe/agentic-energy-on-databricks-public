resources:
  jobs:
    nemweb_app_serving:
      name: ${var.resource_prefix}-app-serving
      max_concurrent_runs: 1
      queue:
        enabled: true
      permissions:
      - level: CAN_VIEW
        group_name: ${var.participant_group}
      - level: CAN_MANAGE
        group_name: ${var.facilitator_group}
      tasks:
      - task_key: publish_1
        sql_task:
          warehouse_id: ${var.warehouse_id}
          file:
            path: ../src/agentic_energy/serving/gold_nem_app_region_status.sql
          parameters:
            catalog: ${var.catalog}
            schema: ${var.schema}
            app_serving_schema: ${var.app_serving_schema}
            source_mode: ${var.nemweb_mode}
      - task_key: publish_2
        sql_task:
          warehouse_id: ${var.warehouse_id}
          file:
            path: ../src/agentic_energy/serving/gold_nem_scada_generation_5min.sql
          parameters:
            catalog: ${var.catalog}
            schema: ${var.schema}
            app_serving_schema: ${var.app_serving_schema}
            source_mode: ${var.nemweb_mode}
        depends_on:
        - task_key: publish_1
      - task_key: publish_3
        sql_task:
          warehouse_id: ${var.warehouse_id}
          file:
            path: ../src/agentic_energy/serving/gold_nem_unit_dispatch_5min.sql
          parameters:
            catalog: ${var.catalog}
            schema: ${var.schema}
            app_serving_schema: ${var.app_serving_schema}
            source_mode: ${var.nemweb_mode}
        depends_on:
        - task_key: publish_2
      tags:
        data_classification: mode_explicit
        writer: lakehouse_only
