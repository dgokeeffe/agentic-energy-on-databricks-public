bundle:
  name: agentic-energy-baseline
  engine: direct
  databricks_cli_version: ">= 1.16.1"
include:
- resources/*.yml
experimental:
  skip_name_prefix_for_schema: true
artifacts:
  default:
    type: whl
    path: .
    build: uv build --wheel
variables:
  resource_prefix:
    default: energy-${bundle.target}-${var.deployment_id}
  catalog:
    description: Existing Unity Catalog catalog; configure outside Git.
  schema:
    default: energy_${bundle.target}_${var.schema_suffix}
  landing_schema:
    description: Schema containing the managed landing Volume; defaults to the pipeline
      schema
    default: ${var.schema}
  app_serving_schema:
    description: Isolated schema containing the regular Delta synced-table source
    default: ${var.schema}_serving
  volume_reader_principal:
    default: ${workspace.current_user.userName}
  volume_writer_principal:
    default: ${workspace.current_user.userName}
  landing_path:
    description: Managed Volume parent; source mode selects the snapshot or live sibling.
    default: /Volumes/${var.catalog}/${var.landing_schema}/${var.landing_volume}
  landing_volume:
    description: Managed Unity Catalog Volume name for immutable NEMWEB archives and
      manifests
    default: nemweb_landing
  warehouse_id:
    description: Serverless SQL warehouse used only by regular Delta publication jobs.
    default: ${resources.sql_warehouses.analytics.id}
  nemweb_mode:
    description: NEMWEB source mode; set to live only for an explicitly approved live
      run
    default: snapshot
  allow_live_nemweb:
    description: Deployment-controlled approval gate; set true only with explicit
      operator approval
    default: 'false'
  critical_lookback_hours:
    description: Bounded lookback for five-minute Current report discovery
    default: '2'
  context_lookback_days:
    description: Bounded lookback for regional context discovery.
    default: '3'
  max_files_per_cycle:
    description: Maximum source archives accepted in one landing cycle
    default: '100'
  network_timeout_seconds:
    description: Per-request NEMWEB network timeout
    default: '30'
  network_retry_count:
    description: Maximum bounded network retries per NEMWEB request
    default: '3'
  runtime_service_principal:
    description: Runtime service principal application ID; required in lab.
    default: ''
  participant_group:
    description: Workspace group permitted to inspect or run resources.
    default: users
  facilitator_group:
    description: Workspace group permitted to manage resources.
    default: admins
  deployment_id:
    description: Unique lowercase identifier (letters, digits, hyphens), at most 18
      characters. Required for isolation.
  schema_suffix:
    description: Unique SQL identifier suffix using letters, digits and underscores.
  lakebase_project_id:
    description: Existing Lakebase project ID.
  postgres_branch_id:
    description: Explicit dedicated Lakebase branch ID.
  postgres_database_id:
    default: databricks-postgres
  postgres_branch:
    default: projects/${var.lakebase_project_id}/branches/${var.postgres_branch_id}
  postgres_database:
    default: ${var.postgres_branch}/databases/${var.postgres_database_id}
  app_name:
    default: energy-${bundle.target}-${var.deployment_id}
  snapshot_version:
    description: Packaged application snapshot version; v2 aligns price and SCADA
      intervals.
    default: v2
targets:
  dev:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${var.deployment_id}/${bundle.target}
    presets:
      trigger_pause_status: PAUSED
      name_prefix: ''
  lab:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${var.deployment_id}/${bundle.target}
    presets:
      trigger_pause_status: PAUSED
    variables:
      volume_reader_principal: ${var.runtime_service_principal}
      volume_writer_principal: ${var.runtime_service_principal}
    resources:
      jobs:
        nemweb_lander:
          permissions:
          - service_principal_name: ${var.runtime_service_principal}
            level: CAN_MANAGE_RUN
          run_as:
            service_principal_name: ${var.runtime_service_principal}
        nemweb_refresh:
          permissions:
          - service_principal_name: ${var.runtime_service_principal}
            level: CAN_MANAGE_RUN
          run_as:
            service_principal_name: ${var.runtime_service_principal}
        nemweb_context_refresh:
          permissions:
          - service_principal_name: ${var.runtime_service_principal}
            level: CAN_MANAGE_RUN
          run_as:
            service_principal_name: ${var.runtime_service_principal}
        nemweb_app_serving:
          permissions:
          - service_principal_name: ${var.runtime_service_principal}
            level: CAN_MANAGE_RUN
          run_as:
            service_principal_name: ${var.runtime_service_principal}
      pipelines:
        nemweb:
          permissions:
          - service_principal_name: ${var.runtime_service_principal}
            level: CAN_RUN
          run_as:
            service_principal_name: ${var.runtime_service_principal}
      sql_warehouses:
        analytics:
          permissions:
          - service_principal_name: ${var.runtime_service_principal}
            level: CAN_USE
sync:
  include:
  - app/dist/**
  - app/client/dist/**
  exclude:
  - tests/**
  - app/tests/**
  - app/**/*.test.ts
  - app/**/*.test.tsx
  - .claude/**
