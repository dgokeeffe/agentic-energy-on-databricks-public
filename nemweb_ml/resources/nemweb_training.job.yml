resources:
  jobs:
    nemweb_training:
      name: "${var.resource_prefix}-ml-train"
      max_concurrent_runs: 1
      queue:
        enabled: true
      tasks:
        - task_key: train_challenger
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/train.py
            base_parameters:
              experiment_name: ${var.mlflow_experiment_name}
              model_name: ${var.uc_model_name}
              training_table: ${var.training_table}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - mlflow>=3.0
              - scikit-learn>=1.5
              - ../dist/*.whl
      tags:
        prepared: "true"
        model_alias_limit: challenger_only
