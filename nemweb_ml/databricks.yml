bundle:
  name: nemweb-ml
  engine: direct

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: rm -rf dist && uv build --wheel --out-dir dist

variables:
  catalog:
    description: Unity Catalog catalog shared with the foundation bundle
    default: ${workspace.current_user.short_name}
  schema:
    description: Unity Catalog schema shared with the foundation bundle
    default: agentic_energy_workshop
  resource_prefix:
    description: Run-specific prefix beginning with agentic-energy-workshop-
    default: agentic-energy-workshop-${workspace.current_user.short_name}
  mlflow_experiment_name:
    description: Workspace MLflow experiment created by this bundle
    default: ${resources.experiments.nemweb.name}
  uc_model_name:
    description: Three-level Unity Catalog model created by this bundle
    default: ${resources.registered_models.price_model.full_name}
  training_table:
    description: Three-level governed historical training table
    default: ${var.catalog}.${var.schema}.gold_nem_region_dispatch_5min
  feature_table:
    description: Three-level governed batch feature table
    default: ${var.catalog}.${var.schema}.gold_nem_region_dispatch_5min
  prediction_table:
    description: Three-level governed prediction target table
    default: ${var.catalog}.${var.schema}.ml_nem_region_price_predictions

targets:
  dev:
    default: true
    mode: development
