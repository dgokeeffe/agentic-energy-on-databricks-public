bundle:
  name: agentic-energy-workshop-d4-clean
  # Use the Databricks direct deployment engine. This avoids Terraform state and
  # keeps participant deployments driven by the bundle itself.
  engine: direct

include:
  - resources/*.yml

artifacts:
  default:
    type: whl
    path: .
    build: rm -rf dist && uv build --wheel --out-dir dist

variables:
  resource_prefix:
    description: Run-specific prefix beginning with agentic-energy-workshop-
  catalog:
    description: Unity Catalog catalog for this target
  schema:
    description: Unity Catalog schema for this target
  landing_schema:
    description: Schema containing the managed landing Volume; defaults to the pipeline schema
    default: ${var.schema}
  app_serving_schema:
    description: Isolated schema containing the regular Delta synced-table source
  volume_reader_principal:
    description: >-
      Unity Catalog principal granted READ_VOLUME on the NEMWEB landing Volume.
      Kept separate from participant_group because UC resolves only
      account-level principals, while workspace-local groups are valid for
      Job/Pipeline ACLs. Defaults to the participant group for shared targets.
    default: ${var.participant_group}

  volume_writer_principal:
    description: >-
      Unity Catalog principal granted READ_VOLUME and WRITE_VOLUME on the NEMWEB
      landing Volume. Must be able to write landed archives.
    default: ${var.facilitator_group}

  landing_path:
    description: >-
      Fully-qualified UC Volume parent path for NEMWEB landing. The lander and
      pipeline both append the validated nemweb_mode, producing isolated
      snapshot/ and live/ sibling roots. Composed from catalog, landing_schema
      and landing_volume so a live-evidence pipeline can use new checkpoints
      without copying the immutable landing Volume. It is a distinct variable
      because the direct deployment
      engine resolves literal /Volumes/... strings against Volume resource
      nodes, and a variable-interpolated literal has no such node.
    default: /Volumes/${var.catalog}/${var.landing_schema}/${var.landing_volume}

  landing_volume:
    description: Managed Unity Catalog Volume name for immutable NEMWEB archives and manifests
  warehouse_id:
    description: SQL warehouse used by NEMWEB evidence, semantic and analyst tasks
  lakebase_cdf_history_table:
    description: >-
      Fully qualified Unity Catalog name of the immutable Lakebase-generated
      lb_investigations_history table. Supply through BUNDLE_VAR_; no resource
      identifier or host is stored in Git.
    default: ${var.catalog}.${var.schema}.lb_investigations_history
  nemweb_mode:
    description: NEMWEB source mode; set to live only for an explicitly approved live run
    default: snapshot
  allow_live_nemweb:
    description: Deployment-controlled approval gate; set true only with explicit operator approval
    default: "false"
  critical_lookback_hours:
    description: Bounded lookback for five-minute Current report discovery
    default: "2"
  context_lookback_days:
    description: >-
      Bounded lookback for slower NEMWEB context reports, in days.

      Must be at least 3. Next_Day_Dispatch is a T+1 report whose filename token
      is the PRIOR trading day, so the newest available archive is routinely more
      than 24h old by that token (observed 2026-09-02 14:43 AEST: newest was
      PUBLIC_NEXT_DAY_DISPATCH_20260901, ~38h old). A 1-day window makes the
      required listing look empty and fails the context cycle.

      Do not raise this far without also raising the lander timeout: the daily
      bid archive is ~9 MB compressed / ~134 MB expanded per day.
    default: "3"
  max_files_per_cycle:
    description: Maximum source archives accepted in one landing cycle
    default: "100"
  network_timeout_seconds:
    description: Per-request NEMWEB network timeout
    default: "30"
  network_retry_count:
    description: Maximum bounded network retries per NEMWEB request
    default: "3"
  runtime_service_principal:
    description: >-
      Service principal that owns ETL job execution and Volume writes in the
      shared workshop target. Unused by dev, which runs as the deploying
      identity, so it is optional there.
    default: ""
  participant_group:
    description: Group allowed to view and run the workshop job
  facilitator_group:
    description: Group allowed to manage the workshop job
  live_evidence_resource_prefix:
    description: Isolated live-evidence resource prefix; required for target live_evidence
  live_evidence_schema:
    description: Pre-existing isolated pipeline and Delta landing schema
  live_evidence_landing_schema:
    description: Pre-existing isolated managed-Volume schema
  live_evidence_landing_volume:
    description: Isolated managed Volume name
  live_evidence_app_serving_schema:
    description: Pre-existing isolated app-serving schema

# Values are intentionally supplied through BUNDLE_VAR_* environment
# variables or --var. No workspace, catalog, schema, or principal is committed.
# DATABRICKS_HOST is intentionally supplied by the authenticated CLI/CI
# environment because bundle interpolation is not supported for auth fields.
# Development resource names are namespaced by the deploying identity, but UC
# table/Volume paths are supplied variables and are therefore intentionally NOT
# claimed to be isolated. Operators must use identity-qualified dev schema and
# Volume names; ../docs/nemweb-operations.md makes this a pre-deployment gate.
targets:
  dev:
    default: true
    mode: development
    # No run_as: the job runs as whoever deploys it. This is what makes the
    # target safe for many developers at once.
    #
    # Volume grants are overridden to the deploying identity in dev. Unity
    # Catalog resolves only account-level principals, whereas workspace-local
    # groups are sufficient for Job/Pipeline ACLs. A per-developer dev target
    # needs no shared-group data grant, so granting to the deployer keeps the
    # bundle deployable without requiring account-group administration.
    variables:
      volume_reader_principal: ${workspace.current_user.userName}
      volume_writer_principal: ${workspace.current_user.userName}

  live_evidence:
    mode: development
    variables:
      resource_prefix: ${var.live_evidence_resource_prefix}
      schema: ${var.live_evidence_schema}
      landing_schema: ${var.live_evidence_landing_schema}
      landing_volume: ${var.live_evidence_landing_volume}
      app_serving_schema: ${var.live_evidence_app_serving_schema}
      nemweb_mode: live
      allow_live_nemweb: "true"
      volume_reader_principal: ${workspace.current_user.userName}
      volume_writer_principal: ${workspace.current_user.userName}

  workshop:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.runtime_service_principal}
    # Grant lists MERGE with the base resource definition, so only the
    # target-specific runtime principal is added here. Reader/writer principals
    # come from volume_reader_principal / volume_writer_principal, which default
    # to the participant and facilitator groups. Those must be account-level
    # principals for Unity Catalog to resolve them.
    resources:
      volumes:
        nemweb_landing:
          grants:
            - principal: ${var.runtime_service_principal}
              privileges: [READ_VOLUME, WRITE_VOLUME]
