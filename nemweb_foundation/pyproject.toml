[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-energy-on-databricks"
version = "0.1.0"
description = "Reusable, metadata-driven energy data foundation for Databricks"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
# pyyaml is test-only: the bundle contract tests parse databricks.yml so that a
# change which breaks concurrent deploys fails offline instead of in a
# workspace. It is not a runtime dependency of the wheel.
test = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
# Primary governed NEMWEB workflow.
agentic-energy = "agentic_energy.cli:main"
main = "agentic_energy.cli:main"
# Explicit compatibility entry point for the original local JSONL demo.
agentic-energy-local-fixture = "agentic_energy.legacy_cli:main"
local-fixture = "agentic_energy.legacy_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["agentic_energy*"]

[tool.setuptools.package-data]
agentic_energy = [
  "resources/metadata/*.json",
  "resources/fixtures/*.jsonl",
  "resources/nemweb_snapshot/v1/**/*",
]
