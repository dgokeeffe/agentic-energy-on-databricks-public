resources:
  pipelines:
    nemweb_lakebase_cdf:
      name: "${var.resource_prefix}-cdf-current"
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      photon: true
      channel: CURRENT
      root_path: ..
      libraries:
        - file:
            path: ../agentic_energy/nemweb/pipeline/lakebase_investigations.py
      configuration:
        spark.sql.session.timeZone: UTC
        nemweb.lakebase_cdf_history_table: ${var.lakebase_cdf_history_table}
      permissions:
        - level: CAN_RUN
          group_name: ${var.participant_group}
        - level: CAN_MANAGE
          group_name: ${var.facilitator_group}
      tags:
        data_source: lakebase_cdf
        prepared: "false"
