# Legacy local JSONL fixture/demo resource.
#
# NEMWEB Lakeflow is the primary runtime. This job remains available only for a
# deterministic compatibility demonstration and has no production schedule.
resources:
  jobs:
    agentic_energy_local_fixture:
      name: "${var.resource_prefix}-local-fixture"
      max_concurrent_runs: 1
      queue:
        enabled: true
      # run_as is target-owned: dev runs as the deployer and workshop uses the
      # explicitly configured service principal.
      permissions:
        - level: CAN_MANAGE_RUN
          group_name: ${var.participant_group}
        - level: CAN_MANAGE
          group_name: ${var.facilitator_group}
      parameters:
        - name: metadata_path
          default: ""
        - name: metadata_snapshot_id
          default: ""
      tasks:
        - task_key: local_fixture_demo
          environment_key: default
          max_retries: 0
          python_wheel_task:
            package_name: agentic-energy-on-databricks
            entry_point: local-fixture
            parameters:
              - --metadata
              - "{{job.parameters.metadata_path}}"
              - --metadata-root
              - ${var.landing_path}
              - --metadata-snapshot-id
              - "{{job.parameters.metadata_snapshot_id}}"
              - --output
              - ${var.landing_path}/${bundle.target}/legacy-fixture/runs/{{job.run_id}}
              - --run-id
              - "{{job.run_id}}"
              - --mode
              - fixture
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl
      tags:
        runtime_status: legacy_fixture_only
        source_mode: fixture
