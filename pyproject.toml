[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-energy-on-databricks"
version = "0.1.0"
description = "Reusable, metadata-driven energy data foundation for Databricks"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["tzdata; sys_platform == 'win32'"]

[project.optional-dependencies]
# pyyaml is test-only: the bundle contract tests parse databricks.yml so that a
# change which breaks concurrent deploys fails offline instead of in a
# workspace. It is not a runtime dependency of the wheel.
test = ["pytest>=8.0", "pyyaml>=6.0"]

[project.scripts]
# Primary governed NEMWEB workflow.
agentic-energy = "agentic_energy.cli:main"
main = "agentic_energy.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_energy*"]

[tool.setuptools.package-data]
agentic_energy = [
  "resources/nemweb_snapshot/**/*",
]

[tool.uv]
package = true

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
